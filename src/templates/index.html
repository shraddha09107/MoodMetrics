<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoodMetrics — Point. Capture. Read the room.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E0F13;
    --panel: #191B22;
    --panel-2: #20232C;
    --line: #2B2F3A;
    --text: #EDEAE3;
    --text-muted: #878C99;
    --accent: #F5A623;
    --focus: #4ADE80;
    --rec: #E5484D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(245,166,35,0.09), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 0 0 70px;
  }

  main { max-width: 620px; margin: 0 auto; padding: 0 24px; }

  /* Hero */
  header.hero { text-align: center; padding: 52px 0 30px; }
  .brand {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.25em;
    color: var(--text-muted); text-transform: uppercase; margin-bottom: 18px;
  }
  .brand b { color: var(--accent); }
  .headline {
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 30px;
    line-height: 1.25; margin: 0; letter-spacing: -0.01em;
  }
  .headline .cycle {
    display: inline-block; min-width: 150px; text-align: left;
    border-bottom: 3px solid currentColor; padding-bottom: 2px;
    transition: color 0.3s;
  }
  .sub {
    color: var(--text-muted); font-size: 15px; margin: 16px auto 0; max-width: 440px; line-height: 1.5;
  }

  /* Mode dial (segmented control, camera-app style) */
  .mode-dial-wrap { display: flex; justify-content: center; margin: 34px 0 26px; }
  .mode-dial {
    position: relative; display: inline-flex; background: var(--panel);
    border: 1px solid var(--line); border-radius: 999px; padding: 4px;
  }
  .mode-dial .indicator {
    position: absolute; top: 4px; bottom: 4px; border-radius: 999px;
    background: var(--accent); transition: left 0.28s cubic-bezier(.4,0,.2,1), width 0.28s cubic-bezier(.4,0,.2,1);
    z-index: 0;
  }
  .mode-dial button {
    position: relative; z-index: 1; border: none; background: transparent;
    color: var(--text-muted); font-family: 'Inter', sans-serif; font-weight: 700;
    font-size: 13.5px; padding: 10px 20px; border-radius: 999px; cursor: pointer;
    display: flex; align-items: center; gap: 7px; transition: color 0.2s;
  }
  .mode-dial button.active { color: #14161C; }

  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* Zone tag — styled like a photo geotag, not a plain form field */
  .zone-tag {
    display: flex; align-items: center; gap: 8px; justify-content: center;
    margin-bottom: 16px;
  }
  .zone-tag span.icon { color: var(--text-muted); font-size: 13px; }
  .zone-tag input {
    background: transparent; border: none; border-bottom: 1px dashed var(--line);
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 13px;
    text-align: center; padding: 4px 2px; width: 160px;
  }
  .zone-tag input:focus { outline: none; border-bottom-color: var(--accent); }

  /* Viewfinder — the signature element, used for image/video capture and live feed */
  .viewfinder {
    display: block;
    position: relative; background: #05060A; border-radius: 18px;
    aspect-ratio: 4 / 3; overflow: hidden; cursor: pointer;
    border: 1px solid var(--line);
  }
  .viewfinder input[type=file] { display: none; }
  .corner {
    position: absolute; width: 26px; height: 26px; border-color: var(--accent);
    transition: border-color 0.2s, transform 0.2s; z-index: 2; pointer-events: none;
  }
  .corner.tl { top: 16px; left: 16px; border-top: 3px solid; border-left: 3px solid; border-top-left-radius: 6px; }
  .corner.tr { top: 16px; right: 16px; border-top: 3px solid; border-right: 3px solid; border-top-right-radius: 6px; }
  .corner.bl { bottom: 16px; left: 16px; border-bottom: 3px solid; border-left: 3px solid; border-bottom-left-radius: 6px; }
  .corner.br { bottom: 16px; right: 16px; border-bottom: 3px solid; border-right: 3px solid; border-bottom-right-radius: 6px; }
  .viewfinder.locked .corner { border-color: var(--focus); }
  .viewfinder.dragover .corner { transform: scale(1.15); }

  .vf-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 20px;
    color: var(--text-muted); gap: 8px;
  }
  .vf-center .reticle {
    width: 46px; height: 46px; border: 1.5px dashed var(--line); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    margin-bottom: 6px;
  }
  .vf-center .main-text { font-weight: 600; font-size: 14px; color: var(--text); }
  .vf-center .sub-text { font-size: 12px; }
  .vf-preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  .vf-filename {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(5,6,10,0.8); color: var(--focus); font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px; padding: 5px 12px; border-radius: 999px; display: none; z-index: 2;
  }

  button.action {
    display: block;
    width: 100%; margin-top: 18px; background: var(--accent); color: #14161C; border: none;
    padding: 13px 24px; border-radius: 10px; font-family: 'Inter', sans-serif;
    font-weight: 700; font-size: 14.5px; cursor: pointer; transition: background 0.15s;
  }
  button.action:hover { background: #ffb84d; }
  button.action:disabled { background: var(--line); color: var(--text-muted); cursor: default; }

  #image-result, #video-result { margin-top: 18px; }
  #image-result img { max-width: 100%; border-radius: 10px; margin-top: 12px; border: 1px solid var(--line); }
  .loading { color: var(--text-muted); font-style: italic; font-size: 13px; }
  .err { color: var(--rec); font-size: 13px; }
  .batch-summary {
    background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.3);
    color: var(--text); border-radius: 10px; padding: 12px 16px; font-size: 13px;
    line-height: 1.6; margin-bottom: 16px;
  }
  .batch-summary strong { color: var(--focus); }
  .photo-result { padding: 14px 0; border-top: 1px solid var(--line); }
  .photo-result:first-of-type { border-top: none; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--text-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  td { font-family: 'JetBrains Mono', monospace; }

  /* Live camera feed inside the same viewfinder shell */
  #camera-viewfinder img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .live-badge {
    display: none; position: absolute; top: 14px; left: 14px; z-index: 3;
    background: rgba(5,6,10,0.85); color: #fff; font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 999px;
    align-items: center; gap: 6px; letter-spacing: 0.06em;
  }
  .live-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rec); animation: pulse 1.4s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(229,72,77,0.6); }
    70% { box-shadow: 0 0 0 8px rgba(229,72,77,0); }
    100% { box-shadow: 0 0 0 0 rgba(229,72,77,0); }
  }

  .shutter-row { display: flex; flex-direction: column; align-items: center; margin-top: 22px; gap: 10px; }
  .shutter {
    width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--text-muted);
    background: transparent; cursor: pointer; display: flex; align-items: center;
    justify-content: center; transition: border-color 0.2s;
  }
  .shutter:hover { border-color: var(--text); }
  .shutter .inner { width: 56px; height: 56px; border-radius: 50%; background: var(--rec); transition: all 0.2s; }
  .shutter.live { border-color: var(--rec); animation: pulse 1.4s infinite; }
  .shutter.live .inner { width: 30px; height: 30px; border-radius: 8px; }
  .shutter-label { font-size: 12.5px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

  .dash-link {
    display: block; text-align: center; margin-top: 30px; color: var(--text-muted);
    font-size: 14px; text-decoration: none; font-weight: 600;
  }
  .dash-link:hover { color: var(--accent); }
</style>
</head>
<body>

<main>

  <header class="hero">
    <div class="brand">Mood<b>Metrics</b></div>
    <h1 class="headline">Your customers just looked <span class="cycle" id="cycle-word">happy</span></h1>
    <p class="sub">Point a camera at them and find out for sure — MoodMetrics reads the room from a photo, a video, or your live feed.</p>
  </header>

  <div class="mode-dial-wrap">
    <div class="mode-dial" id="mode-dial">
      <div class="indicator" id="mode-indicator"></div>
      <button class="active" data-tab="image" onclick="showTab('image', this)">📷 Photo</button>
      <button data-tab="video" onclick="showTab('video', this)">🎞️ Video</button>
      <button data-tab="camera" onclick="showTab('camera', this)">🔴 Live</button>
    </div>
  </div>

  <!-- PHOTO PANEL -->
  <div id="panel-image" class="panel active">
    <form id="image-form">
      <div class="zone-tag"><span class="icon">📍</span><input type="text" name="zone" id="image-zone" value="entrance"></div>

      <label class="viewfinder" id="image-dropzone">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <input type="file" name="image" id="image-input" accept="image/*" multiple required>
        <div class="vf-center" id="image-vf-center">
          <div class="reticle">＋</div>
          <div class="main-text">Tap to capture</div>
          <div class="sub-text">or drop photos — select several for a batch</div>
        </div>
        <img class="vf-preview" id="image-preview">
        <div class="vf-filename" id="image-filename"></div>
      </label>

      <button type="submit" class="action">Analyze Photo<span id="image-btn-count"></span></button>
    </form>
    <div id="image-result"></div>
  </div>

  <!-- VIDEO PANEL -->
  <div id="panel-video" class="panel">
    <form id="video-form">
      <div class="zone-tag"><span class="icon">📍</span><input type="text" name="zone" id="video-zone" value="uploaded_video"></div>

      <label class="viewfinder" id="video-dropzone">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
        <input type="file" name="video" id="video-input" accept="video/*" required>
        <div class="vf-center" id="video-vf-center">
          <div class="reticle">▶</div>
          <div class="main-text">Tap to capture</div>
          <div class="sub-text">or drop a video — frames get sampled across the clip</div>
        </div>
        <div class="vf-filename" id="video-filename"></div>
      </label>

      <button type="submit" class="action">Analyze Video</button>
    </form>
    <div id="video-result"></div>
  </div>

  <!-- LIVE PANEL -->
  <div id="panel-camera" class="panel">
    <div class="zone-tag"><span class="icon">📍</span><input type="text" id="camera-zone" value="live_camera"></div>

    <div class="viewfinder" id="camera-viewfinder" style="cursor:default;">
      <span class="corner tl"></span><span class="corner tr"></span>
      <span class="corner bl"></span><span class="corner br"></span>
      <div class="live-badge" id="live-badge"><span class="dot"></span>LIVE</div>
      <div class="vf-center" id="camera-placeholder">
        <div class="reticle">👁</div>
        <div class="main-text">Feed will appear here</div>
        <div class="sub-text">Every detected face is logged automatically</div>
      </div>
      <img id="camera-feed" src="" alt="" style="display:none;">
    </div>

    <div class="shutter-row">
      <button class="shutter" id="shutter-btn" onclick="toggleCamera()"><span class="inner"></span></button>
      <div class="shutter-label" id="shutter-label">tap to start</div>
    </div>

    <div id="session-result"></div>
  </div>

  <a class="dash-link" href="/dashboard">View full analytics dashboard →</a>

</main>

<script>
/* Rotating headline word — cycles through real emotion labels in their real colors */
const emotions = [
  { label: "happy", color: "#F5A623" },
  { label: "curious", color: "#4A90D9" },
  { label: "frustrated", color: "#E5484D" },
  { label: "surprised", color: "#E85D9E" },
  { label: "unimpressed", color: "#9096A2" },
];
let ei = 0;
const cycleEl = document.getElementById('cycle-word');
setInterval(() => {
  ei = (ei + 1) % emotions.length;
  cycleEl.style.color = emotions[ei].color;
  cycleEl.textContent = emotions[ei].label;
}, 1900);
cycleEl.style.color = emotions[0].color;

/* Mode dial sliding indicator */
function positionIndicator(btn) {
  const dial = document.getElementById('mode-dial');
  const indicator = document.getElementById('mode-indicator');
  const rect = btn.getBoundingClientRect();
  const dialRect = dial.getBoundingClientRect();
  indicator.style.left = (rect.left - dialRect.left) + 'px';
  indicator.style.width = rect.width + 'px';
}
window.addEventListener('load', () => positionIndicator(document.querySelector('.mode-dial button.active')));
window.addEventListener('resize', () => positionIndicator(document.querySelector('.mode-dial button.active')));

function showTab(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.mode-dial button').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
  positionIndicator(btn);
  if (name !== 'camera') stopCamera();
}

/* Viewfinder drag/drop + focus-lock behavior (image viewfinder supports multiple files) */
function setupViewfinder(zoneId, inputId, centerId, filenameId, previewId) {
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(inputId);
  const filenameEl = document.getElementById(filenameId);
  const preview = previewId ? document.getElementById(previewId) : null;
  const center = document.getElementById(centerId);
  const btnCount = document.getElementById('image-btn-count');

  input.addEventListener('change', () => {
    if (!input.files.length) return;
    const files = Array.from(input.files);
    zone.classList.add('locked');
    filenameEl.style.display = 'block';

    if (files.length === 1) {
      filenameEl.textContent = '✓ ' + files[0].name;
      if (btnCount) btnCount.textContent = '';
    } else {
      filenameEl.textContent = '✓ ' + files.length + ' photos selected';
      if (btnCount) btnCount.textContent = ' (' + files.length + ')';
    }

    if (preview && files[0].type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = e => {
        preview.src = e.target.result;
        preview.style.display = 'block';
        center.style.display = 'none';
      };
      reader.readAsDataURL(files[0]);
    } else if (!preview) {
      center.querySelector('.main-text').textContent = 'Ready to analyze';
      center.querySelector('.sub-text').textContent = files[0].name;
    }
  });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('dragover'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      input.files = e.dataTransfer.files;
      input.dispatchEvent(new Event('change'));
    }
  });
}
setupViewfinder('image-dropzone', 'image-input', 'image-vf-center', 'image-filename', 'image-preview');
setupViewfinder('video-dropzone', 'video-input', 'video-vf-center', 'video-filename', null);

document.getElementById('image-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const resultDiv = document.getElementById('image-result');
  const btn = this.querySelector('button');
  btn.disabled = true;
  resultDiv.innerHTML = '<p class="loading">Analyzing...</p>';
  fetch('/analyze_image', { method: 'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      btn.disabled = false;
      if (data.error) { resultDiv.innerHTML = '<p class="err">' + data.error + '</p>'; return; }

      const bs = data.batch_summary;
      let html = '';

      // Batch summary banner (only really useful when more than one photo)
      if (bs.photos > 1) {
        const counts = Object.entries(bs.emotion_counts)
          .sort((a, b) => b[1] - a[1])
          .map(([e, c]) => e + ': ' + c)
          .join(' · ');
        html += '<div class="batch-summary"><strong>' + bs.photos + ' photos analyzed</strong> — ' +
          bs.faces_detected + ' faces detected total' + (counts ? '<br>' + counts : '') + '</div>';
      }

      data.results.forEach(r => {
        html += '<div class="photo-result">';
        if (r.error) {
          html += '<p class="err">' + r.filename + ': ' + r.error + '</p>';
        } else {
          html += '<img src="' + r.annotated_image_url + '">';
          if (r.detections.length === 0) {
            html += '<p class="loading" style="margin-top:8px;">No faces detected in ' + r.filename + '.</p>';
          } else {
            html += '<table><tr><th>Zone</th><th>Emotion</th><th>Confidence</th></tr>';
            r.detections.forEach(d => {
              html += '<tr><td>' + d.zone + '</td><td>' + d.emotion + '</td><td>' + d.confidence + '%</td></tr>';
            });
            html += '</table>';
          }
        }
        html += '</div>';
      });
      resultDiv.innerHTML = html;
    })
    .catch(err => { btn.disabled = false; resultDiv.innerHTML = '<p class="err">Request failed: ' + err + '</p>'; });
});

document.getElementById('video-form').addEventListener('submit', function(e) {
  e.preventDefault();
  const formData = new FormData(this);
  const resultDiv = document.getElementById('video-result');
  const btn = this.querySelector('button');
  btn.disabled = true;
  resultDiv.innerHTML = '<p class="loading">Processing video... this can take a minute depending on length.</p>';
  fetch('/analyze_video', { method: 'POST', body: formData })
    .then(r => r.json())
    .then(data => {
      btn.disabled = false;
      if (data.error) { resultDiv.innerHTML = '<p class="err">' + data.error + '</p>'; return; }
      resultDiv.innerHTML =
        '<p><strong>Done.</strong> ' + data.total_frames + ' frames read, ' +
        data.frames_analyzed + ' analyzed, ' + data.faces_detected +
        ' face detections logged (' + data.duration_seconds + 's video).</p>' +
        '<a class="dash-link" style="margin-top:0;" href="/dashboard">View results on the dashboard →</a>';
    })
    .catch(err => { btn.disabled = false; resultDiv.innerHTML = '<p class="err">Request failed: ' + err + '</p>'; });
});

let cameraLive = false;
let sessionStart = null;
function toggleCamera() { cameraLive ? stopCamera() : startCamera(); }

function startCamera() {
  const zoneVal = document.getElementById('camera-zone').value || 'live_camera';
  document.getElementById('session-result').innerHTML = '';
  fetch('/server_time')
    .then(r => r.json())
    .then(data => {
      sessionStart = data.now;
      document.getElementById('camera-feed').src = '/video_feed?zone=' + encodeURIComponent(zoneVal) + '&t=' + Date.now();
      document.getElementById('camera-feed').style.display = 'block';
      document.getElementById('camera-placeholder').style.display = 'none';
      document.getElementById('live-badge').style.display = 'flex';
      document.getElementById('shutter-btn').classList.add('live');
      document.getElementById('shutter-label').textContent = 'recording — tap to stop';
      document.getElementById('camera-viewfinder').classList.add('locked');
      cameraLive = true;
    });
}

function stopCamera() {
  document.getElementById('camera-feed').src = '';
  document.getElementById('camera-feed').style.display = 'none';
  document.getElementById('camera-placeholder').style.display = 'flex';
  document.getElementById('live-badge').style.display = 'none';
  document.getElementById('shutter-btn').classList.remove('live');
  document.getElementById('shutter-label').textContent = 'tap to start';
  document.getElementById('camera-viewfinder').classList.remove('locked');
  const wasLive = cameraLive;
  cameraLive = false;

  if (wasLive && sessionStart) {
    const zoneVal = document.getElementById('camera-zone').value || 'live_camera';
    const params = 'since=' + encodeURIComponent(sessionStart) + '&zone=' + encodeURIComponent(zoneVal) + '&source=webcam';
    const sessionDiv = document.getElementById('session-result');
    sessionDiv.innerHTML = '<p class="loading">Wrapping up session summary...</p>';

    fetch('/session_summary?' + params)
      .then(r => r.json())
      .then(s => {
        if (!s.total) {
          sessionDiv.innerHTML = '<p class="loading">No faces detected during that session.</p>';
          return;
        }
        const distLines = Object.entries(s.distribution)
          .sort((a, b) => b[1] - a[1])
          .map(([e, p]) => e + ': ' + p + '%')
          .join(' · ');
        sessionDiv.innerHTML =
          '<div class="batch-summary"><strong>' + s.total + ' faces logged this session</strong> — mostly ' +
          s.top_emotion + '<br>' + distLines + '</div>' +
          '<p class="loading">Asking the LLM to write up the full report...</p>';

        // Automatically fetch the full AI report right after the quick stats —
        // no extra click needed.
        return fetch('/generate_session_report?' + params).then(r => r.json());
      })
      .then(reportData => {
        if (!reportData) return; // no-detections case above already handled and returned early
        const loadingP = sessionDiv.querySelector('.loading:last-of-type');
        if (loadingP) loadingP.remove();
        if (reportData.error) {
          const p = document.createElement('p');
          p.className = 'err';
          p.textContent = reportData.error;
          sessionDiv.appendChild(p);
        } else {
          const box = document.createElement('div');
          box.className = 'batch-summary';
          box.style.whiteSpace = 'pre-wrap';
          box.textContent = reportData.report;
          sessionDiv.appendChild(box);
        }
      })
      .catch(() => { sessionDiv.innerHTML = '<p class="err">Could not load session summary.</p>'; });
  }
}
</script>

</body>
</html>
